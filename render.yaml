services:
  - type: web
    name: keypulse-bot
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: TOKENBOT
        sync: false
      - key: ADMINID
        sync: false
      - key: PROXY
        value: ""
      - key: PORT
        value: "8000"
